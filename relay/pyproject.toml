[project]
name = "xo-relay"
version = "0.1.0"
description = "Fixed-egress relay: XoLogic Product API -> NetSuite / Shopify (Premier Lighting)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "urllib3>=2.0",
  "PyYAML>=6.0",
  "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
